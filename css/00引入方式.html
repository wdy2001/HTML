<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: pink;
        }
    </style>
</head>
<body>
    <!--
        如何引入css
            方式1：
                行内式 通过元素的style属性引入样式
                style="样式名:值;样式名:值;"
                缺点：复用率低，不利于维护；样式与html代码一起，影响阅读，影响文件大小，影响性能

            方式2：
                内嵌式 通过在head标签中的style标签定义本页面的公共样式
                通过选择器确定影响的元素

            方式3：
                外部样式表 将css样式单独放到一个.css文件中，通过head中的link标签引入
                <link rel="stylesheet" href="00样式1.css">
    -->
</body>
</html>
