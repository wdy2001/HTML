<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{ 
            background-color: red;
        }
        #1{ 

            background-color: blue;
        }
        .b11{ 
            background-color: yellow;
        }
        
    </style>
</head>
<body>
    <!--
        1.元素选择器 
            语法：标签名{},只能限定固定标签
        2.id选择器 根据标签的id值确定样式的作用元素，id唯一，只能作用到一个元素
            语法：#id{}
        3.class选择器 根据元素的class属性值确定样式的作用范围，calss可重复，可有多个值，可作用多个元素
            语法：.class{}
    -->
    <input type="button" class="b11" value="111"/>
    <textarea name="" id="1" cols="30" rows="10"></textarea>
    <table class="b11" id="12" >
        <tr>11</tr>
    </table>
</body>
</html>
