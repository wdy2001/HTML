<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width: 100px;
            height: 75px;
            background-color: aqua;
            border: 1px solid black;
            display: inline;
        }
        .div2{
            width: 500px;
            height: 500px;
            border: 5px solid palevioletred
        }
    </style>
</head>
<body>
    <!--
        1.display 默认为block块，可设置为inline行内，让元素在同一行，但是宽高样式不生效，不建议
        2.浮动样式
            float 设置浮动
                float: right; 浮动向右
                float: left; 浮动向左 
                需要注意，可能会被其他元素覆盖，但是文字不会被覆盖，图片会被覆盖
    -->
    <div class="div2">
        <div class="div1">111</div>
        <div class="div1">222</div>
        <div class="div1">333</div>
        <div class="div1">444</div>
    </div>
</body>
</html>
