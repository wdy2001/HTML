<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09</title>
</head>
<body>
    <!--
        css 设置样式，通过元素的style属性设置
            style="样式名:样式值;样式名:样式值;样式名:样式值;"

        块元素 div 自己独占一行，样式的宽、高生效
            适合页面布局

        行内元素 span 自己不会独占一行，样式的宽、高很多不生效
            适合划定范围，样式作用范围内
    -->
    <div name="0" style="background-color: aqua;width: auto;height: auto;">
        <div name="1" style="background-color: beige;width: 200px;height: 100px;margin: 10px auto;">页面开头部分</div>
        <div name="2" style="background-color: bisque;width: 200px;height: 100px;margin: 10px auto;">页面中间部分</div>
        <div name="3" style="background-color: burlywood;width: 200px;height: 100px;margin: 10px auto;">页面结尾部分</div>
        <span name="4" style="background-color: chocolate;">行内元素</span>
    </div>
</body>
</html>
