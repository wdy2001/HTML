<!--
    超链接标签
    a
        href 用于定义要跳转的目标资源的地址
            1.完整的url https://www.baidu.com/
            2.相对路径  以当前资源的所在路径为出发点去找目标资源
                        ./ 表示当前资源的所在路径，可省略
                        ../ 表示当前资源的上一级目录
            3.绝对路径  无论当前资源在哪，以固定位置作为出发点去找目标资源
                        以/开头，将根目录作为出发点，例如/test1/1.html
            
        target 用于定义目标资源的打开方式
            1._self 用当前窗口打开
            2._blank 用新窗口打开
-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>超链接标签</title>
    </head>
    <body>
        <a href="https://www.baidu.com">百度一下</a>
        <a href="03列表标签.html" target="_blank">03</a>
        <a href="../test0/test00.html">test00</a>
    </body>
</html>
