<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        form 表单标签
            action 表单数据的提交地址
                1.url
                2。相对路径
                3.绝对路径

            method 定义表单提交的方法
                GET  参数会以键值对的形式放在url后提交,数据直接暴露在地址栏，不安全，
                    地址栏长度限制，提交数据量不大，地址栏只能存字符，不能提交文件，比post高效
                    url?key1=value1&key2=value2&key3=value3

                POST  参数默认不会放到url后，数据不会直接暴露在地址栏，相对安全
                        数据单独打包通过请求体发送，提交的数据量较大，请求体内可以是字符、字节数据，可提交文件
                        比get效率略低
                    
                        
        表单项标签
            表单项标签，例如input一定要定义name属性，用于明确提交时的参数名
            表单项标签还需要定义value属性，用于明确提交时的实参，代码中定义效果为界面默认值
        input 
            type 输入信息的表单项类型
                text 单行普通文本框
                password 单行密码框
                submit 提交按钮
                reset 重置按钮
                radio 单选，需要多个单选框使用同一个name属性值，才能实现单选效果;value值为提交的值
                    加checked表示默认选中，若有多个则以后面的为先
                checkbox 复选，value为提交的值，checked为默认选中
                hidden 隐藏域，不显示在页面上，提交时会携带（希望用户提交一些特定的信息，考虑安全问题或者操作问题，不希望数据改变）
                    readonly 属性，表示只读，不能修改，表单提交时携带
                    disable 属性，表示禁用，不能修改，表单提交时不携带

        textArea 文本域

        select 下拉框
            option 选项


    -->
    <form action="08welcome.html" method="get">
        <!-- 添加表单项标签 -->
         用户名:<input type="text" name="111" value=""/><br>
         密码:<input type="password" name="123"/><br>
         <input type="submit" value="登录"/>
         <input type="reset" value="重置"/>
         <input type="radio" name="1" value="1"/>男
         <input type="radio" name="1" value="2"/>女

         <textarea name="1" width="200px" height="300px">121</textarea>

         <select name="112">
            <option value="1">1</option>
            <option value="2">2</option>
         </select>

         <input type="file">
    </form>
</body>
</html>
